# Injeção automática do agent Java do New Relic pelo k8s-agents-operator, já instalado no cluster
# pelo oficina-kubernetes (newrelic-bundle). O Instrumentation do time seleciona só o oficina-api;
# este seleciona o OS Service. Nenhuma mudança no Dockerfile: o operator adiciona um init container
# com o agent nos pods com a anotação instrumentation.newrelic.com/inject-java.
apiVersion: newrelic.com/v1beta3
kind: Instrumentation
metadata:
  name: os-service-java
spec:
  agent:
    language: java
    # Mesma imagem usada pelo Instrumentation da API principal (oficina-kubernetes)
    image: newrelic/newrelic-java-init:latest
  # Secret com a license key, criado no namespace oficina pelo oficina-kubernetes
  licenseKeySecret: newrelic-license
  podLabelSelector:
    matchLabels:
      app.kubernetes.io/name: os-service
