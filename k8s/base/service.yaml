apiVersion: v1
kind: Service
metadata:
  name: os-service
  labels:
    app.kubernetes.io/name: os-service
    app.kubernetes.io/component: api
spec:
  # ClusterIP na base; o overlay eks expõe com LoadBalancer, como a API principal
  type: ClusterIP
  selector:
    app.kubernetes.io/name: os-service
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: 80
      targetPort: http
