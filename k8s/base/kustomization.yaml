# Manifestos do OS Service, comuns a todos os ambientes. Os overlays (k8s/overlays) acrescentam
# namespace, exposição, banco e segredos de cada ambiente.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
labels:
  - pairs:
      app.kubernetes.io/part-of: oficina
    includeSelectors: false
resources:
  - configmap.yaml
  - deployment.yaml
  - service.yaml
  - hpa.yaml
images:
  # Substituída no deploy pela imagem do commit (scripts/deploy-k8s.sh)
  - name: oficina-os-service
    newTag: local
