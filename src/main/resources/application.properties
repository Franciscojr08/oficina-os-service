spring.application.name=oficina-os-service

# Servidor
server.port=8080
server.servlet.context-path=/oficina/v1

# Datasource (banco próprio do OS Service)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/os_service}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.hikari.maximum-pool-size=${SPRING_DATASOURCE_POOL_SIZE:5}
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# RabbitMQ (mensageria da Saga)
spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:guest}
# O publicador do outbox espera a confirmação do broker antes de marcar o evento como publicado.
spring.rabbitmq.publisher-confirm-type=simple
# Consumo: erro transitório ganha 2 novas tentativas (3 no total); esgotadas, a mensagem vai para a
# DLQ e nunca volta para a fila, o que travaria o consumidor em loop. Mensagem inválida não é
# repetida (ver ConsumoRetryConfig). No Boot 4 a propriedade é max-retries (novas tentativas).
spring.rabbitmq.listener.simple.default-requeue-rejected=false
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-retries=${OFICINA_MENSAGERIA_NOVAS_TENTATIVAS:2}
spring.rabbitmq.listener.simple.retry.initial-interval=500ms
spring.rabbitmq.listener.simple.retry.multiplier=2

# Mensageria da Saga: exchanges, filas e outbox (contrato em docs/mensageria.md)
oficina.mensageria.exchange-os=os.eventos
oficina.mensageria.exchange-billing=billing.eventos
oficina.mensageria.exchange-execucao=execucao.eventos
oficina.mensageria.fila-entrada=oficina-os-eventos
oficina.mensageria.outbox.agendamento-habilitado=${OFICINA_OUTBOX_AGENDAMENTO_HABILITADO:true}
oficina.mensageria.outbox.intervalo-ms=${OFICINA_OUTBOX_INTERVALO_MS:1000}
oficina.mensageria.outbox.lote=${OFICINA_OUTBOX_LOTE:50}
oficina.mensageria.retencao.outbox-dias=${OFICINA_RETENCAO_OUTBOX_DIAS:7}
oficina.mensageria.retencao.eventos-processados-dias=${OFICINA_RETENCAO_EVENTOS_PROCESSADOS_DIAS:30}

# Saga orquestrada: prazo de resposta das etapas automáticas e reenvio do comando
oficina.saga.prazo-orcamento=${OFICINA_SAGA_PRAZO_ORCAMENTO:5m}
oficina.saga.prazo-estorno=${OFICINA_SAGA_PRAZO_ESTORNO:10m}
oficina.saga.max-tentativas=${OFICINA_SAGA_MAX_TENTATIVAS:3}
oficina.saga.verificacao.agendamento-habilitado=${OFICINA_SAGA_VERIFICACAO_HABILITADA:true}
oficina.saga.verificacao.intervalo-ms=${OFICINA_SAGA_VERIFICACAO_INTERVALO_MS:30000}
oficina.saga.verificacao.lote=50

# JWT (mesmo segredo da Lambda de autenticação; em produção vem de Secret do Kubernetes)
security.jwt.secret=${SECURITY_JWT_SECRET:jwt-local-secret-123456789012345678901234567890}
security.jwt.expiration=${SECURITY_JWT_EXPIRATION:7200000}

# Actuator: health com probes de liveness/readiness para o Kubernetes
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never

# Swagger / OpenAPI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
